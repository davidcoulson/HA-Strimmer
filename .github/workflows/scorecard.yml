# OpenSSF Scorecard: a weekly check of this repository's supply-chain practices (pinned actions,
# token permissions, branch protection, a security policy, signed releases, and so on). Results
# land in the Security tab as code-scanning alerts, and publish_results feeds the public badge
# and the api.securityscorecards.dev entry for this repo.
#
# The permissions are the action's documented minimum: id-token to sign the published result,
# security-events to upload SARIF. Nothing else, and the checkout keeps no credentials.
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '27 6 * * 1'
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
