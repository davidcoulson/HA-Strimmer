configuration:
  dashboards:
    name: Dashboards to serve
    description: >-
      The url_path of each dashboard this app should serve, from Settings → Dashboards
      (e.g. kitchen-kiosk). Only these are trimmed; anything not listed is served whole.
      Leave empty and the app refuses websockets rather than relaying the full firehose.
  always_forward:
    name: Always forward these entities
    description: >-
      Entities to forward even when no dashboard references them. A literal entity_id, or
      a /regex/. Needed for anything your cards don't name — Assist pipeline and wake-word
      entities behind a Voice Satellite card, and any entity that panel-side JavaScript
      READS. JavaScript that only writes an entity does not need this, because callService
      resolves on the server.
  never_forward:
    name: Never forward these entities
    description: >-
      Entities to withhold even when a dashboard does reference them. Literal or /regex/.
      Applied last, so it overrides both dashboard detection and the always list.
  strip_entities:
    name: Strip the entity websocket
    description: >-
      The core feature. Off turns the app into a plain pass-through proxy, which is
      useful for an A/B comparison when you want to measure what the trimming is worth.
  per_dashboard:
    name: Serve each connection only its own dashboard
    description: >-
      Each connection gets just the entities its dashboard needs, instead of the union of
      every dashboard above — so a panel showing one dashboard stops paying for the rest.
      A connection that can't be attributed falls back to the union, so nothing is ever
      served less than it needs.
  trim_registries:
    name: Trim the entity, device and area registries
    description: >-
      Cuts the registries to what the connection can actually see. On a large instance
      these are the biggest payload left once states are trimmed — one row per entity for
      the whole install, including the list_for_display variant. Turn this off first if
      names, areas or device links start rendering oddly.
  compress_websocket:
    name: Compress the websocket
    description: >-
      Negotiates permessage-deflate with the browser, which Home Assistant's own websocket
      does. Leave this on: without it the app removes compression that HA would
      otherwise have provided. Only worth turning off on very weak hardware, where the
      compression CPU costs more than the bytes it saves.
  trim_resources:
    name: Trim Lovelace resources (custom cards)
    description: >-
      Sends each dashboard only the custom cards it uses. Resources are instance-wide in
      Home Assistant, so every kiosk normally parses every card you have installed. OFF BY
      DEFAULT because a wrongly dropped resource can fail SILENTLY — see the Documentation
      tab before enabling, and read the "dropped by ALL dashboards" block in the log.
  trim_services:
    name: Trim the service list
    description: >-
      Cuts get_services to the domains this connection can see. It carries every service of
      every integration and is sent on every page load — 193KB across 115 domains on a large
      install. Off by default: the frontend uses it for service pickers and the automation
      editor, so this is fine for a kiosk and visibly lossy in the admin UI.
  trim_translations:
    name: Trim frontend translations
    description: >-
      Cuts `frontend/get_translations` to the integrations a connection can actually see. It is
      the largest untrimmed payload left in a page load — measured at 5,359 keys and 432KB on one
      instance, every key of it `component.<integration>`, across 69 integrations. A panel showing
      lights and a printer does not need `component.tuya_local`, which alone carried 823 keys.
      THE MOST LOSSY OPTION HERE, and off by default: a missing translation does not fail quietly
      like a missing service, it renders its raw key on the dashboard — you would see
      `component.light.entity_component._.state.on` where "On" should be. A tree is kept when it
      matches either an entity domain the connection can see or the integration that provides one
      of its entities; both are needed, because a Tuya sensor's state names live under the
      integration while its entity_id says `sensor`. Turn it on, load every panel, and look before
      trusting it.
  trim_repairs:
    name: Trim the Repairs backlog
    description: >-
      Empties `repairs/list_issues`, the admin Repairs panel's list of outstanding issues. A kiosk
      never renders it, and it costs about 27KB on every single page load. Off by default because
      it is genuinely lossy in one direction: an admin browsing a trimmed dashboard stops seeing
      repair notifications there. The list is emptied rather than withheld — the frontend asks for
      it and waits for an answer, so it gets a valid "nothing to report" instead of a request that
      never completes.
  user_agent_dashboards:
    name: Dashboard by client app (fallback)
    description: >-
      Attribute a connection by its client app when nothing else can. The Home Assistant
      companion app opens a native connection that never loads a dashboard page, so it has no
      cookie and no IP hint and gets the union of every dashboard instead of the one it shows.
      Match part of its User-Agent (literal or /regex/) — for the companion app,
      io.robbie.HomeAssistant — and name the dashboard to assume. Used only when cookie and IP
      both fail, and only dashboards you already serve can be chosen.
  user_overrides:
    name: Per-user entity rules
    description: >-
      Always/never lists that apply to one Home Assistant USER. This is the only way to express
      "David sees update.* but Michelle does not" when both open the same dashboard. Give the
      user's name as shown in Settings → People (or their user id), then their own
      always_forward / never_forward patterns. Add `dashboard` to scope a rule to one dashboard,
      so "David sees update.* on lovelace" does not follow him onto a wall panel; omit it and
      the rule applies wherever that user connects. Identity comes from the browser's own access
      token, resolved once per session; leave this empty and no lookup is ever made.
  dashboard_overrides:
    name: Per-dashboard entity rules
    description: >-
      Always/never lists that apply to ONE dashboard instead of all of them. The global lists
      above are right for something every dashboard needs; they are wrong for something a
      single dashboard needs, because every panel then pays for it. Give a dashboard's
      url_path, then its own always_forward / never_forward patterns — same syntax as the
      global lists. The global never list still wins last.
  client_overrides:
    name: Per-device entity rules
    description: >-
      Always/never lists pinned to a physical CLIENT rather than to a dashboard or a user. Some
      entities belong to the device in front of you, not to the page it happens to be showing —
      a browser-based voice satellite is the clearest case, where the satellite entities are only
      ever useful to the one panel that IS that satellite. A dashboard rule gets that wrong both
      ways: the panel loses them when it navigates elsewhere, and every other client opening that
      dashboard pays for them. Give an IP, a CIDR (10.2.4.0/24), or a hostname — hostnames are
      resolved when the allowlist is built, so a DHCP lease can move without breaking the rule.
      Note that mDNS/.local names usually do NOT resolve from inside a container; use a real DNS
      record. `devices` names whole DEVICES by registry name or id and pulls in every entity that
      device owns, which keeps working when an integration adds entities in a later release.
  mqtt_sensors:
    name: Publish long-term metrics over MQTT
    description: >-
      Publishes about fifteen high-level metrics as real Home Assistant sensors, so the recorder
      builds long-term statistics for them and you can graph months rather than minutes. Broker
      credentials come from Supervisor automatically when the Mosquitto app is installed —
      nothing to configure. The stats panel answers "what is happening right now"; these answer
      "what has been happening since June", which is a different question: a slowly climbing
      entity count means a dashboard picked up a broad filter, and a rebuild counter that never
      stops rising is the kind of fault that is invisible in any single snapshot. Uses MQTT
      discovery rather than the REST API deliberately — states pushed over REST are not
      registered entities, vanish on restart, and the recorder will not summarise them.
  cert_monitor_host:
    name: Certificate to watch
    description: >-
      Optional. A hostname whose TLS certificate expiry to publish as a sensor, e.g.
      `ha.example.org`. The certificate is read by actually connecting to the host, not by reading
      a file from disk — whatever issues and renews it, the question worth answering is what a
      browser is handed today. A renewal that succeeded into the wrong directory looks perfect on
      disk and still takes your dashboards down. Leave empty to skip the check.
  mdns_discovery:
    name: Identify devices via mDNS
    description: >-
      Ask the network what each connecting device actually IS. Most panels already announce
      themselves over multicast DNS — a Kiosk Satellite publishes its name and version, an ESPHome
      device and a ha-paneld panel publish theirs — so the stats panel can label a row "Office Test
      Panel, Kiosk Satellite 2026.9.46" instead of just an IP address. It also lets a per-device
      rule use a `.local` hostname, which the container's own resolver cannot look up. Purely
      observational: it never decides what a client is served, because an mDNS name is a label a
      device chose for itself and matching it against Home Assistant device names would be
      guesswork. Turn off if you do not want the app sending multicast queries.
  mdns_services:
    name: mDNS service types to look for
    description: >-
      Leave empty for the default set (_kiosk-satellite._tcp.local, _esphomelib._tcp.local,
      _ha-paneld._tcp.local, _googlecast._tcp.local). Add a service type to recognise something
      else on your network. A full sweep is deliberately not done — it would return printers and
      speakers too, for more traffic and no benefit.
  exclude_device_categories:
    name: Drop these entity categories from devices
    description: >-
      When a DEVICE is expanded — by a card configured with a device rather than entities, or by
      a per-device rule — drop entities Home Assistant has labelled `config` (controls that
      configure the device: panel brightness, a reset button, a firmware update) or `diagnostic`
      (readings about its health: last seen, signal, status code). A litter robot carries 21
      entities and a card rendering a fill level needs a handful of them. EMPTY BY DEFAULT on
      purpose: whether a given card renders a diagnostic sensor is not knowable from here, and a
      wrongly dropped entity blanks part of a card with no error anywhere. The app logs the
      split for every device it expands — "21 entities (12 primary, 6 config, 3 diagnostic)" —
      so look there first and decide with the real number in front of you.
  resources_always_forward:
    name: Always send these resources
    description: >-
      URL fragments of resources to send regardless, e.g. kiosk-mode. Needed for anything
      that runs on load instead of rendering a card, because nothing references it by
      name — frontend patchers (without kiosk-mode the HA header and sidebar reappear),
      icon packs, and resident modules such as idle timers or pop-ups. Literal substring
      or /regex/.
  resources_never_forward:
    name: Never send these resources
    description: >-
      URL fragments of resources to withhold from every dashboard. Overrides the always
      list. Literal substring or /regex/.
  log_level:
    name: How much to log
    description: >-
      How much detail the app writes to its own log. `info` is the default and is what it has
      always written. `warn` keeps only problems and the startup summary — worth having because a
      busy instance turns over twenty-odd websocket connections a minute, and each one wrote a
      line whether you wanted it or not. `debug` adds per-connection and per-decision detail that
      is not written at all otherwise: which dashboard a connection was attributed to and why,
      which resource matched which card, and cache hits. Turn it on while chasing something and
      turn it back down afterwards — it is genuinely noisy.
  port:
    name: Listen port
    description: >-
      The port the app serves on (default 9123). Because it runs with host networking,
      this option is the only way to move it — the Network tab cannot remap a host-network
      port. Change it if something else already uses 8099.
  ha_base:
    name: Home Assistant URL (advanced)
    description: >-
      Override the Home Assistant address the app proxies to. Only needed when the
      internal hostname does not resolve under host networking — then set something like
      http://192.168.1.10:8123.
  allow_ws_url:
    name: Allowlist websocket URL (advanced)
    description: >-
      Override the websocket used once at startup to work out each dashboard's entities.
      Only needed when the supervisor hostname does not resolve; requires a token via
      ALLOW_TOKEN.
