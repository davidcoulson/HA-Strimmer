name: WebSocket Stripper
version: "2026.09.15.17"
slug: websocket_stripper
stage: stable
description: Serves your real HA dashboards but trims the entity websocket to only what each dashboard uses — fast kiosk loads, full fidelity.
# This fork, not upstream. `url` is what the Apps UI links to from the app's page, so it has to
# point at the code that is actually installed — the version, changelog and docs shown there
# should describe what is running. Upstream is credited in the README instead, which is the
# right place for attribution and the wrong place for a "what am I running?" link.
url: https://github.com/davidcoulson/HA-Websocket-Stripper
# armv7 is deliberately absent. Home Assistant deprecated 32-bit ARM in 2025.6 and dropped it
# after 2025.12, and `node:24-alpine` publishes no arm/v7 image at all — so leaving it listed
# would advertise an install that cannot build. amd64 and aarch64 are what both the base image
# and Home Assistant itself still support.
arch:
  - amd64
  - aarch64
init: false
# host_network: lets the app see the REAL browser IP (not the Docker gateway
# 172.30.32.1), so HA's trusted_networks auth provider can match the kiosk's LAN IP
# via X-Forwarded-For. With a mapped port the client IP is rewritten by Docker before
# the proxy sees it, breaking trusted login. Trade-off: the app binds :9123 directly
# on the host, and the internal `homeassistant`/`supervisor` DNS names may not resolve —
# use the ha_base / allow_ws_url options below to pin them to IPs if startup fails.
host_network: true
# Ingress: puts the app's own statistics panel in the HA sidebar, with no configuration
# and no extra exposed port to reach it through. It serves on 8100 (see STATS_PORT in the
# proxy), separate from the proxy port, so a dashboard url_path can never collide with a
# stats path. Read-only — it reports, it cannot change anything.
ingress: true
# Must match the STATS_PORT default in ha_ws_trim_proxy.mjs — Supervisor reads this at install
# time and routes Ingress to it, while the process binds the other. If they drift apart the panel
# breaks over Ingress while the direct port still works. A test pins them together.
ingress_port: 9122
panel_icon: mdi:filter-variant
panel_title: Stripper
panel_admin: false
# SUPERVISOR_TOKEN + core API access (used only to precompute the dashboard allowlists).
homeassistant_api: true
hassio_api: true
# Supervisor hands over broker credentials only to an app that declares it wants them.
# `want`, not `need`: with no broker installed the app must still start and proxy.
services:
  - mqtt:want
# No `ports:` mapping: with host_network the app binds the host port directly, so a
# Docker port map is inert. The single source of truth for the listen port is the `port`
# option below (default 9123). Reach the app at http://<host>:<port>.
options:
  # Empty on purpose. This used to default to the author's own dashboards, which on anyone
  # else's instance resolve to nothing — and an empty allowlist is not a harmless no-op: HA
  # reads `set(msg["entity_ids"]) or None`, so an empty entity_ids means NO filter, and the
  # app would relay the full firehose it exists to prevent. Set this to your own
  # dashboards' url_path values (Settings -> Dashboards).
  dashboards: []
  always_forward: []
  never_forward: []
  trim_entities: true
  # Serve each connection only the dashboard it is actually viewing, instead of the union of
  # every dashboard listed above. A panel showing one dashboard stops paying for the others.
  # The dashboard is inferred from the page request that precedes the websocket; when that
  # can't be determined the connection falls back to the union, i.e. the old behaviour.
  by_dashboard: true
  # Also trim the entity/device/area registries to what the connection can see. This is the
  # larger payload on a big instance once states are trimmed. Turn OFF first if names, areas
  # or device links render oddly.
  trim_registries: true
  # HA's own websocket negotiates permessage-deflate; the `ws` library does not do so
  # server-side by default, so putting this proxy in front of HA silently removed compression
  # from the browser leg. On by default to restore that. Turn off only on very weak hardware
  # where deflate CPU costs more than the bytes it saves.
  compress_websocket: true
  # Trim Lovelace resources (custom cards) per dashboard. Resources are instance-wide in HA,
  # so every kiosk parses EVERY custom card you have installed — 21MB of JavaScript for a
  # 4-card wall panel on the instance this was built against. Off by default: unlike entity
  # trimming, a wrongly dropped resource is visible as "Custom element doesn't exist". Every
  # drop is logged with its size, so turn it on, watch one load, and add anything that breaks
  # to resources_always_forward.
  trim_resources: false
  trim_extra_modules: false
  # Cut get_services to the domains a connection can see. 193KB across 115 domains on a
  # large install, of which only the domains you actually have entities in are useful. Off
  # by default: the frontend uses this for service pickers and the automation editor, so
  # trimming it is fine for a kiosk and visibly lossy in the admin UI.
  trim_services: false
  # Empty the admin Repairs backlog for trimmed connections (~27KB per page load).
  trim_repairs: false
  # Send only the themes a dashboard actually uses, plus HA's defaults (~28KB/load).
  trim_themes: false
  # Cut frontend translations to the integrations this connection can see (~247KB/load).
  trim_translations: false
  # URL patterns (literal substring or /regex/) always sent, whatever the content match says.
  # Needed for global plugins that patch the frontend rather than registering a card — they
  # contain none of the dashboard's card names, so the match cannot see that they are used.
  # Per-dashboard always/never, layered on top of the global lists above. The global lists
  # suit something every dashboard needs; they are wrong for something ONE dashboard needs,
  # because the cost lands on every panel. Example: the admin dashboard wants update.* for a
  # pending-updates counter, and a 4-card wall panel should not pay 252 entities for it.
  dashboard_overrides: []
  client_overrides: []
  exclude_device_categories: []
  mqtt_sensors: true
  cert_monitor_host: ""
  mdns_discovery: true
  mdns_services: []
  # Per-USER always/never. The one thing per-dashboard rules cannot express: two people opening
  # the SAME dashboard who should not be served the same entities. Identity comes from the
  # browser's own auth token, resolved once per session against HA's auth/current_user, so it
  # is the real HA user rather than an address. Empty = no lookup happens at all.
  user_overrides: []
  # Attribute a connection by its client app when nothing else identifies it. The companion
  # app's native connection never loads a dashboard page, so it has no cookie and no IP hint
  # and falls back to the union of every dashboard. Its User-Agent does identify it.
  # Last-resort only: a cookie or IP hint always wins, and only dashboards listed above can be
  # selected, so a spoofed User-Agent cannot reach anything you do not already serve.
  user_agent_dashboards: []
  resources_always_forward: []
  # URL patterns never sent to any dashboard. Wins over always.
  resources_never_forward: []
  # warn = problems and the startup summary only; info = normal operation (default);
  # debug = per-connection and per-decision detail, for when you are hunting something.
  log_level: info
  proxy_port: 9123
  # Where the stats panel and JSON API listen. Only the default is reachable over Ingress —
  # Supervisor routes the sidebar panel to ingress_port above, which is fixed at install time.
  mgmt_port: 9122
  ha_base: ""
  allow_ws_url: ""
schema:
  dashboards:
    - str
  always_forward:
    - str
  never_forward:
    - str
  trim_entities: bool
  # The original name for trim_entities. Still accepted so an existing config keeps working.
  strip_entities: "bool?"
  by_dashboard: bool
  # The original name for by_dashboard. Still accepted so an existing config keeps working.
  per_dashboard: "bool?"
  trim_registries: bool
  compress_websocket: bool
  trim_resources: bool
  trim_extra_modules: bool?
  trim_services: bool
  trim_repairs: "bool?"
  trim_themes: "bool?"
  trim_translations: "bool?"
  user_agent_dashboards:
    - match: str
      dashboard: str
  user_overrides:
    - user: str
      dashboard: str?
      always_forward:
        - str?
      never_forward:
        - str?
  dashboard_overrides:
    - dashboard: str
      always_forward:
        - str?
      never_forward:
        - str?
  client_overrides:
    - client: str
      devices:
        - str?
      always_forward:
        - str?
      never_forward:
        - str?
  mqtt_sensors: "bool?"
  cert_monitor_host: "str?"
  mdns_discovery: "bool?"
  mdns_services:
    - str?
  exclude_device_categories:
    - "list(config|diagnostic)?"
  resources_always_forward:
    - str
  resources_never_forward:
    - str
  log_level: "list(warn|info|debug)?"
  proxy_port: "int(1,65535)?"
  port: "int(1,65535)?"
  mgmt_port: "int(1,65535)?"
  stats_port: "int(1,65535)?"
  ha_base: "str?"
  allow_ws_url: "str?"
