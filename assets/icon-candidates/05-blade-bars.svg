<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Strimmer - grass blades as signal bars, trimmed to a level</title>
  <defs><clipPath id="keep"><rect x="0" y="54" width="128" height="74"/></clipPath></defs>
  <rect width="128" height="128" rx="24" fill="#1b2440"/>
  <!-- ghosts of what was trimmed -->
  <g fill="#7cb342" fill-opacity="0.3">
    <path d="M70 106 V50 C70 40 84 32 90 28 V106 Z"/>
