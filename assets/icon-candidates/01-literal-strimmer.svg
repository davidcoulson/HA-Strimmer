<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Strimmer - literal side view</title>
  <defs><clipPath id="tile"><rect width="128" height="128" rx="24"/></clipPath></defs>
  <g clip-path="url(#tile)">
    <rect width="128" height="128" fill="#cfeaf6"/>
    <!-- uncut grass, left -->
    <path d="M0 114 C2 84 6 58 4 36 C14 58 17 86 17 114 Z" fill="#43a047"/>
    <path d="M11 114 C13 80 21 50 31 26 C32 56 30 86 29 114 Z" fill="#2e7d32"/>
    <path d="M24 114 C25 92 23 72 17 54 C32 68 39 90 41 114 Z" fill="#7cb342"/>
    <!-- flying clippings -->
    <rect x="-7" y="-3" width="14" height="6" rx="3" transform="translate(50 74) rotate(-35)" fill="#43a047"/>
    <rect x="-7" y="-3" width="14" height="6" rx="3" transform="translate(60 54) rotate(25)" fill="#7cb342"/>
    <rect x="-6" y="-3" width="12" height="6" rx="3" transform="translate(44 46) rotate(-60)" fill="#2e7d32"/>
    <!-- shaft and handle -->
    <line x1="118" y1="4" x2="72" y2="82" stroke="#f4511e" stroke-width="10" stroke-linecap="round"/>
    <line x1="100" y1="35" x2="84" y2="26" stroke="#263238" stroke-width="8" stroke-linecap="round"/>
    <!-- guard and hub -->
    <path d="M56 78 H98 Q112 78 112 92 V97 H56 Z" fill="#f4511e"/>
    <rect x="61" y="95" width="16" height="9" rx="2" fill="#263238"/>
    <!-- cut stubble and ground -->
    <path d="M38 114 L43 103 L48 114 L53 103 L58 114 L63 103 L68 114 L73 103 L78 114 L83 103 L88 114 L93 103 L98 114 L103 103 L108 114 L113 103 L118 114 L123 103 L128 114 Z" fill="#43a047"/>
    <rect y="112" width="128" height="16" fill="#2e7d32"/>
    <!-- spinning line -->
    <ellipse cx="69" cy="103" rx="42" ry="4" fill="#ffffff"/>
    <ellipse cx="69" cy="103" rx="42" ry="4" fill="none" stroke="#263238" stroke-width="2"/>
  </g>
</svg>
