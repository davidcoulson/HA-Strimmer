<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Strimmer - minimal geometric</title>
  <rect width="128" height="128" rx="24" fill="#558b2f"/>
  <g fill="#f9fbe7">
    <!-- grass: two whole blades, two mown under the disc -->
    <path d="M14 110 L26.500 54 L39 110 Z"/>
    <path d="M39 110 L51.500 54 L64 110 Z"/>
    <path d="M64 110 L69.8 84 H83.2 L89 110 Z"/>
    <path d="M89 110 L94.8 84 H108.2 L114 110 Z"/>
    <!-- spinning disc -->
    <circle cx="89" cy="44" r="17"/>
  </g>
  <!-- rotation arcs -->
  <g fill="none" stroke="#f9fbe7" stroke-width="7" stroke-linecap="round">
    <path d="M60.8 33.7 A30 30 0 0 1 99.3 15.800"/>
    <path d="M117.2 54.3 A30 30 0 0 1 78.7 72.2"/>
  </g>
</svg>
